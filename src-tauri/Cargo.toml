[package]
name = "elysium"
version = "1.0.0"
description = "Elysium — 여러 AI CLI를 엮어 완성된 답을 내는 AI 클라이언트"
edition = "2021"
rust-version = "1.90"

[lib]
name = "elysium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# 원격 제어(폰 앱): TLS(자체 인증서, ring) + HTTP/WebSocket + 페어링 QR
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
sha2 = "0.10"
ignore = "0.4"
rand = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
# 다른 네트워크에서의 원격 연결: 공개키로 연결하는 QUIC(홀펀칭, 안 되면 암호화된 채 릴레이 경유). 포트 포워딩 불필요
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "portmapper"] }
portable-pty = "0.9.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }
